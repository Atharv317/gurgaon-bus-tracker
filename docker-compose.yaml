services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: gurgaon-bus-postgres
    environment:
      POSTGRES_DB: gurgaon_bus
      POSTGRES_USER: gurgaon
      POSTGRES_PASSWORD: gurgaon_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gurgaon -d gurgaon_bus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: gurgaon-bus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: