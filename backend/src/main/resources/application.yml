spring:
  application:
    name: gurgaon-bus-tracker

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/gurgaon_bus
    username: gurgaon
    password: gurgaon_dev_password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info